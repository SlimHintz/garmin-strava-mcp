[project]
name = "garmin-strava-mcp"
version = "0.1.0"
description = "MCP server and REST API for your own Garmin Connect and Strava data, with a SQLite training log"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=1.28,<2",
    "garminconnect>=0.3",
    "starlette>=0.40",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
